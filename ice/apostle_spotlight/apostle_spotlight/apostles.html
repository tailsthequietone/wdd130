<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        body{
            background-color: #e8eced;
        }
        div {
            background-image: url("images/christus.webp");
            background-repeat: no-repeat;
            background-size: cover ;
            background-position: center;
            border: 5px solid black;
            border-radius: 5%;
            margin: 0 auto;
            max-width: 80%;
        }
        h1 {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        h2 {
            color: white;  
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
       
        .home-grid {
            position: relative;
            display: grid;
        }
         #Apostles_id {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            margin: auto;
         }
        .apostle_class {
            border: 10px solid white;
            border-radius: 100%;
            z-index: 1;
            width: 150px;
            height: 150px; 
            margin: 25px;
                
    
        }
        #President_class {
            border: 10px solid white;
            border-radius: 100%;
            width: 200px;  
            height: 200px;    
        }
         #First_presidency_id {
            display: flex;
            justify-content: center;

        }
        .first_presidency_class {
            border: 10px solid white;
            border-radius: 100%;
            z-index: 1;
            width: 150px;
            height: 150px; 
            margin: 25px;
        }
    </style>
</head>
<body>
    <div class="home-grid"> 
        <h1>First Presidency</h1>
        <section id="First_presidency_id">
            <img class="first_presidency_class" src="images/oaks.webp" alt="Apostle of the church of Jesus Christ">
            <img id="President_class" src="images/nelson.webp" alt="President of the church of Jesus Christ">
            <img class="first_presidency_class" src="images/eyring.webp" alt="Apostle of the church of Jesus Christ">
        </section>
        <h2>Quorum of the Twelve Apostles</h2>
        <section id="Apostles_id">
            <img class="apostle_class" src="images/holland.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/uchtdorf.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/bednar.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/cook.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/christofferson.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/anderson.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/rasband.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/stevenson.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/renlund.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/gong.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/soares.webp" alt="Apostle of the church of Jesus Christ">
            <img class="apostle_class" src="images/kearon.webp" alt="Apostle of the church of Jesus Christ">
        </section>
   </div>
</body>
</html>
